<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f8; --soft:#f2f3f9; --soft2:#e8eaf4; --line:#e6e8f2; --ink:#0b0d1f; --ink2:#3a3f5c; --muted:#767c98;
    --accent:#4f46e5; --accent2:#6366f1; --accentSoft:#eef0fb; --good:#10b981; --goodSoft:#e6f8f0;
    --warn:#f59e0b; --warnSoft:#fff5e3; --bad:#ef4444; --badSoft:#fdecec; --violetSoft:#f3edff;
    --g-main:linear-gradient(140deg,#312e81 0%,#4338ca 55%,#6366f1 100%);
    --g-text:linear-gradient(100deg,#3730a3 0%,#6366f1 100%);
    --g-sun:linear-gradient(135deg,#f59e0b 0%,#f97316 45%,#ec4899 100%);
    --g-sea:linear-gradient(135deg,#06b6d4 0%,#3b82f6 100%);
    --g-mint:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);
    --g-rose:linear-gradient(135deg,#f43f5e 0%,#ec4899 100%);
    --g-violet:linear-gradient(135deg,#8b5cf6 0%,#6366f1 100%);
    --r:28px; --pad:clamp(18px,4vw,64px); --side:400px;
    --shadow:0 1px 2px rgba(16,18,40,.04),0 12px 32px rgba(16,18,40,.07);
    --shadow2:0 2px 6px rgba(16,18,40,.06),0 24px 60px rgba(16,18,40,.12);
    --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;position:relative}
  .bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(70vw 50vw at 85% -10%,rgba(99,102,241,.10),transparent 65%),
      radial-gradient(50vw 40vw at -10% 0%,rgba(148,163,184,.12),transparent 60%),var(--bg)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  a{color:var(--accent);text-decoration:none}
  .wrap{width:100%;padding:0 var(--pad) calc(130px + env(safe-area-inset-bottom))}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(247,247,248,.7);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
  .bar{padding:calc(14px + env(safe-area-inset-top)) var(--pad) 14px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.04em;font-size:26px}
  .logo{width:42px;height:42px;border-radius:14px;background:var(--ink);display:grid;place-items:center}
  .logo svg{width:24px;height:24px}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;color:var(--ink2);box-shadow:var(--shadow)}
  .pill.on{background:var(--ink);color:#fff}
  .pill svg{width:18px;height:18px}

  /* home */
  .home{display:grid;gap:28px;padding:24px 0 8px}
  .hero{padding:8px 0}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accentSoft);padding:8px 14px;border-radius:999px}
  h1{font-size:clamp(46px,6.4vw,112px);line-height:.98;letter-spacing:-.055em;margin:22px 0 18px;font-weight:800}
  h1 .grad{background:var(--g-text);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{font-size:clamp(17px,1.45vw,22px);line-height:1.5;color:var(--ink2);margin:0;max-width:720px;font-weight:500}
  .card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
  .launch{display:grid;gap:16px}
  .capture{background:var(--g-main);border-radius:32px;padding:clamp(24px,2.6vw,40px);color:#fff;box-shadow:0 24px 50px rgba(49,46,129,.22);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
  .capture::after{content:"";position:absolute;width:320px;height:320px;right:-120px;top:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);pointer-events:none}
  .cap-title{font-size:clamp(26px,2.2vw,36px);font-weight:800;letter-spacing:-.04em;line-height:1.05}
  .cap-sub{font-size:16px;opacity:.88;margin:-4px 0 8px;font-weight:500}
  .cta{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;border-radius:20px;font-size:18px;font-weight:800;color:#fff;background:var(--ink);box-shadow:none;transition:transform .12s,box-shadow .12s}
  .capture .cta{background:#fff;color:var(--ink);box-shadow:0 8px 20px rgba(15,12,50,.18)}
  .cta:hover{transform:translateY(-1px)}
  .cta:active{transform:scale(.985)}
  .cta svg{width:22px;height:22px}
  .ghost{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:18px;background:var(--soft);font-weight:700;color:var(--ink2);font-size:16px}
  .capture .ghost{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
  .capture .ghost:hover{background:rgba(255,255,255,.24)}
  .ghost svg{width:20px;height:20px}
  .note{width:100%;padding:16px 18px;border-radius:18px;border:1.5px solid var(--line);background:#fff;outline:none;font-size:16px}
  .note:focus{border-color:#c9ccff;box-shadow:0 0 0 4px var(--accentSoft)}
  .capture .note{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
  .capture .note::placeholder{color:rgba(255,255,255,.78)}
  .capture .note:focus{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18)}

  .glasses{display:flex;align-items:center;gap:16px}
  .gicon{width:54px;height:54px;border-radius:18px;background:var(--soft);display:grid;place-items:center;flex:none;position:relative}
  .gicon svg{width:30px;height:30px}
  .dot{position:absolute;right:-3px;top:-3px;width:14px;height:14px;border-radius:50%;background:var(--good);border:3px solid #fff}
  .dot.off{background:#c5c9d6}
  .dot.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--good);animation:ping 1.8s infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.6);opacity:0}}
  .gtext b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .gtext span{font-size:14.5px;color:var(--muted);line-height:1.45}

  .section-title{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:36px 2px 14px}
  .features{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .feat{display:flex;flex-direction:column;gap:14px;padding:26px}
  .feat .fi{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
  .feat .fi svg{width:26px;height:26px}
  .feat b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px}
  .feat span{font-size:15px;color:var(--muted);line-height:1.5}
  .recent{display:flex;gap:16px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
  .recent::-webkit-scrollbar{display:none}
  .rc{flex:none;width:210px;padding:10px;border-radius:24px;background:#fff;box-shadow:var(--shadow);text-align:left;transition:transform .15s}
  .rc:hover{transform:translateY(-2px)}
  .rc img{width:100%;height:140px;object-fit:cover;border-radius:16px;background:var(--soft);display:block}
  .rc b{display:block;font-size:15.5px;font-weight:800;margin:10px 6px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rc span{display:block;font-size:13px;color:var(--muted);margin:0 6px 6px;font-weight:600}

  /* session */
  .back{display:inline-flex;align-items:center;gap:6px;margin:18px 0 14px;font-weight:700;color:var(--ink2);font-size:15px;background:#fff;padding:10px 16px 10px 12px;border-radius:999px;box-shadow:var(--shadow)}
  .back svg{width:18px;height:18px}
  .sess{display:flex;flex-direction:column;gap:18px}
  .side{display:contents}
  .objcard{order:0}.mainc{order:1;min-width:0}.sidex{order:2}
  .obj{display:flex;gap:16px;align-items:center}
  .obj img{width:96px;height:96px;border-radius:22px;object-fit:cover;flex:none;background:var(--soft)}
  .obj h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
  .sub{color:var(--muted);font-size:15px;margin-top:6px;font-weight:600}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .tag{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--ink2);text-transform:capitalize}
  .tag.high{background:var(--goodSoft);color:#047857}.tag.medium{background:var(--warnSoft);color:#b45309}.tag.low{background:var(--badSoft);color:#b91c1c}
  .tag.glass{background:var(--violetSoft);color:#6d28d9}
  .tag.fixed{background:var(--accentSoft);color:var(--accent);display:inline-flex;align-items:center;gap:4px;text-transform:none}
  .tag.fixed svg{width:12px;height:12px}
  .editlink{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:14px;font-weight:700;color:var(--accent);padding:8px 12px 8px 10px;border-radius:12px;background:var(--accentSoft)}
  .editlink:hover{background:#e3e6fa}
  .editlink svg{width:15px;height:15px}
  .editbox{margin-top:16px;padding:16px;border-radius:20px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
  .editbox label{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0}
  .editbox input{padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;outline:none;font-size:15.5px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;width:100%}
  .editbox input:focus{border-color:#c7cbf4;box-shadow:0 0 0 4px var(--accentSoft)}
  .edrow{display:flex;gap:10px}
  .edwarn{font-size:13px;color:#92400e;background:var(--warnSoft);padding:8px 12px;border-radius:12px;font-weight:600}
  .edbtns{display:flex;gap:8px;justify-content:flex-end}
  .edbtns button{padding:11px 18px;border-radius:14px;font-weight:800;font-size:15px}
  .edcancel{background:#fff;color:var(--ink2)}
  .edsave{background:var(--ink);color:#fff}
  .seen{margin:16px 0 0;color:var(--ink2);font-size:15.5px;line-height:1.55}
  .banner{display:flex;gap:12px;align-items:flex-start;border-radius:20px;padding:16px 18px;margin-top:14px;font-size:15px;line-height:1.45}
  .banner svg{width:22px;height:22px;flex:none;margin-top:1px}
  .banner.caution{background:var(--warnSoft);color:#92400e}
  .banner.stop{background:#b91c1c;color:#fff;font-weight:700;font-size:clamp(18px,1.6vw,24px);padding:28px;border-radius:28px;margin-top:0}

  .say{margin:4px 2px 20px;font-size:clamp(24px,2.2vw,36px);line-height:1.2;font-weight:800;letter-spacing:-.035em}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .tile{text-align:left;padding:24px;border-radius:26px;background:#fff;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;min-height:170px;display:flex;flex-direction:column}
  .tile:hover{transform:translateY(-3px);box-shadow:var(--shadow2)}
  .tile:active{transform:scale(.98)}
  .tile .ti{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;margin-bottom:18px}
  .tile .ti svg{width:24px;height:24px}
  .tile b{font-size:19px;font-weight:800;letter-spacing:-.03em}
  .tile span{font-size:14.5px;color:var(--muted);margin-top:6px;line-height:1.4}
  .c-setup{background:#eef0fb;color:#4338ca}.c-troubleshoot{background:#fdf0f0;color:#c2410c}.c-learn{background:#ecf7f2;color:#047857}
  .c-maintain{background:#eef5fb;color:#1d4ed8}.c-safety{background:#fdf5e8;color:#b45309}.c-custom{background:#f1f1f5;color:#3f3f5a}

  .taskhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .taskhead h3{margin:0;font-size:clamp(24px,2vw,32px);font-weight:800;letter-spacing:-.04em;flex:1;min-width:60%}
  .grounded{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;background:var(--goodSoft);color:#047857}
  .grounded.no{background:var(--soft2);color:var(--muted)}
  .grounded svg{width:15px;height:15px}
  .progress{height:12px;border-radius:99px;background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin:18px 0 8px}
  .progress i{display:block;height:100%;border-radius:99px;background:var(--g-main);transition:width .4s cubic-bezier(.2,.8,.2,1)}
  .pmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:700}
  .stepcard{margin-top:18px;padding:clamp(26px,3vw,48px);border-radius:32px;background:#fff;box-shadow:var(--shadow2);animation:rise .35s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
  .stepcard::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--g-main)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .num{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--ink);font-size:22px}
  .stepcard h4{font-size:clamp(28px,2.8vw,46px);font-weight:800;letter-spacing:-.045em;margin:20px 0 12px;line-height:1.08}
  .stepcard p{margin:0;font-size:clamp(17px,1.35vw,21px);line-height:1.55;color:var(--ink2);max-width:900px}
  .hint{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-size:14px;font-weight:700;color:var(--accent);background:var(--accentSoft);padding:8px 14px;border-radius:999px}
  .hint svg{width:16px;height:16px}
  .chip-warn{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:15px;color:#92400e;background:var(--warnSoft);padding:14px 16px;border-radius:16px;line-height:1.45;font-weight:600}
  .chip-warn svg{width:18px;height:18px;flex:none;margin-top:1px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px;border-radius:20px;font-weight:800;font-size:18px;background:var(--soft);transition:transform .12s}
  .btn:hover{transform:translateY(-1px)}
  .btn svg{width:22px;height:22px}
  .btn.done{background:#059669;color:#fff;box-shadow:0 10px 22px rgba(5,150,105,.2)}
  .btn.photo{background:var(--ink);color:#fff}
  .mini{display:flex;gap:10px;margin-top:12px}
  .mini button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border-radius:16px;background:var(--soft);font-size:15px;font-weight:700;color:var(--ink2)}
  .mini svg{width:17px;height:17px}
  .verdict{margin-top:16px;padding:14px 16px;border-radius:18px;font-size:15.5px;line-height:1.45;display:flex;gap:10px;font-weight:600}
  .verdict svg{width:20px;height:20px;flex:none;margin-top:1px}
  .verdict.done{background:var(--goodSoft);color:#065f46}.verdict.not_yet{background:var(--warnSoft);color:#92400e}.verdict.unclear{background:var(--soft);color:var(--ink2)}

  .steps{padding:10px}
  .srow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;font-size:15px;font-weight:600}
  .srow.cur{background:var(--accentSoft);font-weight:800}
  .sdot{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--soft2);color:var(--muted);flex:none}
  .srow.done .sdot{background:#059669;color:#fff}.srow.skipped .sdot{background:#e5e7eb;color:#9ca3af}
  .srow.cur .sdot{background:var(--ink);color:#fff}
  .srow.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:#c5c9d6}
  .finish{text-align:center;padding:clamp(30px,4vw,60px) 24px;margin-top:18px}
  .finish .big{font-size:64px}
  .finish h3{font-size:clamp(30px,3vw,48px);font-weight:800;margin:12px 0 8px;letter-spacing:-.045em}
  .finish p{color:var(--muted);margin:0 0 20px;font-size:17px}

  .sources{display:flex;flex-direction:column;gap:8px}
  .src{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:12px 14px;border-radius:16px;background:#fff;color:var(--ink2);box-shadow:var(--shadow);max-width:100%}
  .src svg{width:16px;height:16px;flex:none;color:var(--accent)}
  .src em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .thread{display:flex;flex-direction:column;gap:10px}
  .bub{max-width:min(78%,760px);padding:14px 18px;border-radius:22px;font-size:16px;line-height:1.5;animation:rise .25s ease;font-weight:500}
  .bub.assistant{background:#fff;box-shadow:var(--shadow);border-top-left-radius:8px;align-self:flex-start}
  .bub.user{background:var(--ink);color:#fff;border-top-right-radius:8px;align-self:flex-end}
  .bub.safety{background:var(--badSoft);color:#991b1b;font-weight:700}
  .bub.verify_done{background:var(--goodSoft);color:#065f46}.bub.verify_not_yet{background:var(--warnSoft);color:#92400e}

  /* composer */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(247,247,248,0),rgba(247,247,248,.95) 35%);padding:22px 0 calc(16px + env(safe-area-inset-bottom))}
  .dockin{padding:0 var(--pad);display:flex;gap:10px;align-items:center}
  .compose{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;box-shadow:var(--shadow2);padding:6px 6px 6px 22px}
  .compose input{flex:1;border:0;outline:none;font-size:17px;padding:12px 0;background:transparent;min-width:0;font-weight:500}
  .round{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
  .round svg{width:22px;height:22px}
  .round.send{background:var(--ink);color:#fff}
  .round.cam{background:#fff;color:var(--ink2);box-shadow:var(--shadow2);width:62px;height:62px}
  .round.mic{background:var(--soft);color:var(--ink2)}
  .round.mic.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.45)}100%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}

  /* loading + toast + gate */
  .loading{margin:8vh auto 0;max-width:640px;padding:36px;border-radius:32px;background:#fff;box-shadow:var(--shadow2);display:flex;gap:20px;align-items:center}
  .spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--accentSoft);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em}
  .loading span{font-size:15px;color:var(--muted)}
  .shimmer{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--soft) 0%,var(--soft2) 50%,var(--soft) 100%);background-size:200% 100%;animation:sh 1.2s infinite;margin-top:12px}
  @keyframes sh{to{background-position:-200% 0}}
  .toast{position:fixed;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);opacity:0;z-index:50;background:var(--ink);color:#fff;padding:14px 20px;border-radius:18px;font-size:15px;font-weight:700;box-shadow:var(--shadow2);transition:all .3s;display:flex;gap:10px;align-items:center;max-width:92vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast button{color:#c7c9ff;font-weight:800}
  .gate{position:fixed;inset:0;z-index:60;background:rgba(247,247,248,.92);backdrop-filter:blur(14px);display:grid;place-items:center;padding:24px}
  .gate .card{width:100%;max-width:420px;text-align:center;padding:36px 28px;box-shadow:var(--shadow2)}
  .gate h2{margin:16px 0 6px;font-size:32px;font-weight:800;letter-spacing:-.04em}
  .gate p{color:var(--muted);margin:0 0 18px}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
  .hidden{display:none!important}
  .center{display:grid;place-items:center}
  .mt{margin-top:14px}
  .muted{color:var(--muted)}
  .askrow{display:flex;gap:10px;margin-top:16px}
  .askrow input{flex:1;padding:18px 20px;border-radius:20px;border:0;box-shadow:var(--shadow);outline:none;font-size:16.5px;background:#fff}
  .askrow input:focus{box-shadow:0 0 0 4px var(--accentSoft),var(--shadow)}
  .askrow button{padding:0 26px;border-radius:20px;background:var(--ink);color:#fff;font-weight:800;font-size:16px}
  .hf-strip{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 18px;border-radius:20px;background:var(--ink);color:#fff;font-size:15px;font-weight:700}
  .hf-strip svg{width:18px;height:18px}
  .wave{display:inline-flex;gap:3px;align-items:center;height:18px}
  .wave i{width:3px;border-radius:2px;background:#fff;animation:wv 1s infinite ease-in-out}
  .wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}.wave i:nth-child(4){animation-delay:.45s}
  @keyframes wv{0%,100%{height:4px}50%{height:18px}}

  /* laptop and up: use the whole screen */
  @media (min-width:1000px){
    .home{grid-template-columns:minmax(0,1.25fr) minmax(380px,.75fr);gap:clamp(40px,5vw,96px);align-items:center;min-height:calc(100vh - 230px);padding:clamp(16px,4vh,48px) 0}
    .sess{display:grid;grid-template-columns:var(--side) minmax(0,1fr);gap:clamp(24px,2.5vw,40px);align-items:start}
    .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:84px;max-height:calc(100vh - 92px);overflow:auto;padding:8px 16px 32px;margin:-8px -16px 0;scrollbar-width:none}
    .side::-webkit-scrollbar{display:none}
    .sidex .section-title:first-child{margin-top:6px}
    .obj{flex-direction:column;align-items:flex-start}
    .obj img{width:100%;height:220px;border-radius:22px}
    .dock{left:calc(var(--pad) + var(--side) + clamp(24px,2.5vw,40px) - 24px)}
    .dockin{padding-left:24px}
  }
  @media (min-width:1500px){ :root{--side:460px} }
  @media (max-width:640px){
    .brand{font-size:22px}.logo{width:36px;height:36px}
    .controls{grid-template-columns:1fr}
    .round.cam{width:52px;height:52px}
  }
</style>
</head>
<body>
<div class="bgfx"></div>

<header>
  <div class="bar">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>Glance</div>
    <div class="spacer"></div>
    <button class="pill" id="hfBtn" title="Hands-free: speaks every step and listens for your reply">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 14v-2a9 9 0 0 1 18 0v2"/><path d="M21 15a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2zM3 15a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2z"/></svg>
      <span id="hfLabel">Hands-free</span>
    </button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock hidden" id="dock">
  <div class="dockin">
    <div class="compose">
      <input id="ask" placeholder="Ask anything about it…" enterkeyhint="send" autocomplete="off">
      <button class="round mic" id="micBtn" title="Speak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button class="round send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <button class="round cam" id="camBtn" title="Add a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  </div>
</div>

<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileLib" accept="image/*,.heic,.heif" class="hidden">
<div class="toast" id="toast"></div>

<div class="gate hidden" id="gate">
  <div class="card">
    <div class="center"><div class="logo" style="width:52px;height:52px;border-radius:16px"><svg style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div></div>
    <h2>Glance</h2>
    <p>Enter the access code to continue.</p>
    <input class="note" id="code" type="password" placeholder="Access code" autocomplete="current-password">
    <button class="cta mt" id="codeBtn">Continue</button>
    <div class="err" id="codeErr"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I = {
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  glasses:'<svg viewBox="0 0 32 32" fill="none" stroke="#3b4157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h26"/><path d="M4 13l1 6a4 4 0 0 0 4 3h2a4 4 0 0 0 4-3.5l.5-2.5h1l.5 2.5A4 4 0 0 0 21 22h2a4 4 0 0 0 4-3l1-6"/><path d="M3 13l1.5-4M29 13l-1.5-4"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  ear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5a6 6 0 0 1 12 0c0 3.5-3 4.5-3 7.5a3 3 0 0 1-6 0"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>',
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5v14"/><circle cx="12" cy="12" r="9"/></svg>',
  troubleshoot:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  maintain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>',
  safety:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  custom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>',
};

// ---------------- state
const st = {
  code: sessionStorage.getItem("pa_code") || "",
  view: "home",          // home | loading | session
  s: null,               // current session view from the server
  lastVerdict: null,
  loadingText: "",
  latestSeq: 0,
  status: {},
  hf: localStorage.getItem("pa_hf") === "1",
  spokenN: {},           // session id -> highest message n spoken
  busy: false,
  recent: [],
  editing: false,
};

async function api(path, {method="GET", form=null}={}) {
  const r = await fetch(path, {method, body: form, headers: {"x-access-code": st.code}});
  if (r.status === 401) { showGate(); throw new Error("code"); }
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.detail) || `Something went wrong (${r.status}).`);
  return data;
}
function fd(obj){ const f = new FormData(); for (const [k,v] of Object.entries(obj)) if (v !== undefined && v !== null) f.append(k, v); return f; }

// ---------------- rendering
function render() {
  const m = $("#main");
  $("#dock").classList.toggle("hidden", st.view !== "session");
  $("#hfBtn").classList.toggle("on", st.hf);
  $("#hfLabel").textContent = st.hf ? "Hands-free on" : "Hands-free";
  if (st.view === "home") m.innerHTML = homeHTML();
  else if (st.view === "loading") m.innerHTML = loadingHTML();
  else m.innerHTML = sessionHTML(st.s);
  bind();
}

function homeHTML() {
  const wa = st.status.whatsapp && st.status.whatsapp.enabled;
  const rec = st.recent.length ? `
    <div class="section-title">Pick up where you left off</div>
    <div class="recent">${st.recent.map(r => `
      <button class="rc" data-open="${esc(r.id)}">
        <img src="${r.thumb}" alt="">
        <b>${esc(r.name)}</b>
        <span>${r.channel === "whatsapp" ? "From glasses · " : ""}${r.total ? `${r.done}/${r.total} steps` : esc(stageLabel(r.stage))}</span>
      </button>`).join("")}
    </div>` : "";
  return `
  <section class="home">
    <div class="hero">
      <span class="eyebrow">${I.glasses.replace('stroke="#3b4157"','stroke="currentColor"').replace('viewBox="0 0 32 32"','viewBox="0 0 32 32" style="width:18px;height:18px"')} Built for Meta glasses</span>
      <h1>Glance at it.<br><span class="grad">Get walked through it.</span></h1>
      <p class="lede">Look at any device, machine or product and snap a photo. Glance works out exactly what it is, finds the official instructions, and coaches you one step at a time, out loud.</p>
    </div>
    <div class="launch">
      <div class="capture">
        <b class="cap-title">Start with a photo</b>
        <span class="cap-sub">Anything with a label, a logo or a problem.</span>
        <button class="cta" id="takeBtn">${I.cam} Take a photo</button>
        <button class="ghost" id="libBtn">${I.img} Choose a photo</button>
        <input class="note" id="noteIn" placeholder="Anything I should know? (optional)" autocomplete="off">
      </div>
      <div class="card glasses">
        <div class="gicon">${I.glasses}<span class="dot ${wa ? "live" : "off"}"></span></div>
        <div class="gtext">
          ${wa ? `<b>Listening for your glasses</b><span>Say <i>“Hey Meta, send a photo to Glance.”</i> It'll pop up here and answer in your ear.</span>`
               : `<b>Glasses link not connected</b><span>Snap photos here for now. Connect WhatsApp to send straight from your glasses.</span>`}
        </div>
      </div>
    </div>
  </section>
  ${rec}
  <div class="section-title">Why not just ask a chatbot?</div>
  <div class="features">
    <div class="card feat"><div class="fi c-setup">${I.eye}</div><div><b>Knows the exact model</b><span>Reads labels and logos, then pulls the manufacturer's own manual and cites it.</span></div></div>
    <div class="card feat"><div class="fi c-learn">${I.check}</div><div><b>Checks your work</b><span>Glance at what you did. It confirms each step from a photo before moving on.</span></div></div>
    <div class="card feat"><div class="fi c-custom">${I.ear}</div><div><b>Hands stay on the job</b><span>Every step is spoken in your glasses. Say “done”, “repeat” or ask a question.</span></div></div>
    <div class="card feat"><div class="fi c-safety">${I.shield}</div><div><b>Safe by design</b><span>Stops on smoke, sparks or exposed wiring, and sends risky jobs to a pro.</span></div></div>
  </div>`;
}

function loadingHTML() {
  return `<button class="back" id="homeBtn">${I.back} Home</button>
  <div class="loading"><div class="spin"></div><div style="flex:1"><b id="loadText">${esc(st.loadingText)}</b><span>This takes a few seconds</span><div class="shimmer"></div><div class="shimmer" style="width:70%"></div></div></div>`;
}

function stageLabel(stage){ return ({menu:"Ready",need_info:"Needs a detail",coaching:"In progress",finished:"Done",stopped:"Stopped for safety"})[stage] || ""; }

function objHTML(s) {
  const o = s.object, name = o.object_name || "Not sure yet";
  const sub = [o.brand, o.model].filter(Boolean).join(" · ") || o.category || "";
  return `<div class="card objcard">
    <div class="obj">
      <img src="${s.thumb}" alt="">
      <div style="min-width:0">
        <h2>${esc(name)}</h2>
        ${sub ? `<div class="sub">${esc(sub)}</div>` : ""}
        <div class="tags">
          ${o.corrected ? `<span class="tag fixed">${I.check} Corrected by you</span>` : (o.confidence ? `<span class="tag ${esc(o.confidence)}">${esc(o.confidence)} confidence</span>` : "")}
          ${s.channel === "whatsapp" ? `<span class="tag glass">From your glasses</span>` : ""}
        </div>
      </div>
    </div>
    ${o.what_i_see ? `<p class="seen">${esc(o.what_i_see)}</p>` : ""}
    ${s.stage !== "stopped" ? (st.editing ? editHTML(o) : `<button class="editlink" id="editBtn">${I.pencil} ${o.object_name ? "Wrong device? Edit it" : "Tell me what it is"}</button>`) : ""}
    ${o.hazard === "caution" && s.stage !== "stopped" ? `<div class="banner caution">${I.warn}<div><b>Heads up.</b> ${esc(o.hazard_note || "Take care with this one.")}</div></div>` : ""}
  </div>`;
}

function editHTML(o) {
  return `<div class="editbox">
    <label>What is it?<input id="edName" value="${esc(o.object_name)}" placeholder="e.g. Espresso machine" autocomplete="off"></label>
    <div class="edrow">
      <label>Brand<input id="edBrand" value="${esc(o.brand)}" placeholder="e.g. Breville" autocomplete="off"></label>
      <label>Model<input id="edModel" value="${esc(o.model)}" placeholder="e.g. Barista Express" autocomplete="off"></label>
    </div>
    ${st.s && st.s.steps.length ? `<div class="edwarn">Saving restarts the steps for the corrected device.</div>` : ""}
    <div class="edbtns"><button class="edcancel" id="edCancel">Cancel</button><button class="edsave" id="edSave">Save</button></div>
  </div>`;
}

function sessionHTML(s) {
  if (!s) return "";
  let body = "", side = "";
  if (s.stage === "stopped") {
    const msg = [...s.messages].reverse().find(m => m.kind === "safety");
    body = `<div class="banner stop">${I.warn}<div>${esc(msg ? msg.text : s.safety_message)}</div></div>
      <button class="ghost mt" style="width:100%" id="homeBtn2">Start over with a new photo</button>`;
  } else if (s.stage === "menu" || (s.stage === "need_info" && !s.task.action)) {
    const say = s.stage === "need_info" ? (s.object.question_for_user || lastAssistant(s)) : s.object.spoken;
    body = `<div class="say">${esc(say)}</div>
      ${s.actions.length ? `<div class="tiles">${s.actions.map(a => `
        <button class="tile" data-action="${esc(a.id)}"><div class="ti c-${esc(a.id)}">${I[a.id] || I.custom}</div><b>${esc(a.label)}</b><span>${esc(a.detail)}</span></button>`).join("")}</div>` : ""}
      <div class="askrow"><input id="customIn" placeholder="Or tell me what you need…"><button id="customBtn">Go</button></div>`;
  } else if (s.stage === "need_info") {
    body = `<div class="say">${esc(s.task.question || lastAssistant(s))}</div>
      <div class="askrow"><input id="detailIn" placeholder="Type your answer…"><button id="detailBtn">Send</button></div>`;
  } else if (s.stage === "coaching" || s.stage === "finished") {
    const c = coachParts(s); body = c.main; side = c.side;
  }
  const thread = s.messages.filter(m => !["step","intro","identify"].includes(m.kind) || m.role === "user");
  return `<button class="back" id="homeBtn">${I.back} New photo</button>
    <div class="sess">
      <aside class="side">${objHTML(s)}${side ? `<div class="sidex">${side}</div>` : ""}</aside>
      <section class="mainc">
        ${body}
        ${st.hf ? `<div class="hf-strip"><span class="wave"><i></i><i></i><i></i><i></i></span> Hands-free is on. Say “done”, “repeat”, “didn't work”, or ask anything.</div>` : ""}
        ${thread.length ? `<div class="section-title">Conversation</div><div class="thread">${thread.slice(-14).map(m =>
          `<div class="bub ${m.role} ${esc(m.kind)}">${esc(m.text)}</div>`).join("")}</div>` : ""}
      </section>
    </div>`;
}

function coachParts(s) {
  const total = s.steps.length, cur = Math.min(s.current, total);
  const pct = total ? Math.round((s.steps.filter(x => x.status !== "todo").length) / total * 100) : 0;
  const grounded = s.task.grounded;
  const head = `<div class="taskhead"><h3>${esc(s.task.title || s.task.label)}</h3>
      <span class="grounded ${grounded ? "" : "no"}">${grounded ? I.book + " Official guide" : "General guidance"}</span></div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="pmeta"><span>${s.stage === "finished" ? "All done" : `Step ${cur + 1} of ${total}`}</span><span>${pct}%</span></div>`;
  let card = "";
  if (s.stage === "finished") {
    card = `<div class="card finish"><div class="big">🎉</div><h3>You did it.</h3><p>All ${total} steps are complete.</p>
      <div class="controls"><button class="btn" data-op="restart">${I.repeat} Run again</button><button class="btn done" id="homeBtn3">New photo</button></div></div>`;
  } else {
    const x = s.steps[cur];
    const v = st.lastVerdict;
    card = `<div class="stepcard">
      <div class="num">${cur + 1}</div>
      <h4>${esc(x.title)}</h4>
      <p>${esc(x.detail)}</p>
      ${x.caution ? `<div class="chip-warn">${I.warn}<span>${esc(x.caution)}</span></div>` : ""}
      ${x.check === "photo" ? `<span class="hint">${I.cam} Snap a photo and I'll check it</span>` : ""}
      ${v ? `<div class="verdict ${esc(v.verdict)}">${v.verdict === "done" ? I.check : I.warn}<span>${esc(v.feedback)}</span></div>` : ""}
      <div class="controls">
        <button class="btn done" data-op="next">${I.check} Done</button>
        <button class="btn photo" id="verifyBtn">${I.cam} Check it</button>
      </div>
      <div class="mini">
        <button data-op="back" ${cur === 0 ? "disabled style='opacity:.45'" : ""}>${I.prev} Back</button>
        <button data-op="repeat">${I.repeat} Repeat</button>
        <button id="failBtn">${I.x} Didn't work</button>
      </div>
    </div>`;
  }
  const list = `<div class="section-title">All steps</div><div class="card steps">${s.steps.map((x, i) => `
    <div class="srow ${x.status} ${i === cur && s.stage === "coaching" ? "cur" : ""}"><div class="sdot">${x.status === "done" ? "✓" : i + 1}</div><span>${esc(x.title)}</span></div>`).join("")}</div>`;
  const src = s.sources.length ? `<div class="section-title">Sources</div><div class="sources">${s.sources.map(x =>
    `<a class="src" href="${esc(x.url)}" target="_blank" rel="noopener">${I.link}<em>${esc(host(x.url))} · ${esc(x.title)}</em></a>`).join("")}</div>` : "";
  return {main: head + card, side: list + src};
}

function host(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch { return u; } }
function lastAssistant(s){ const m = [...s.messages].reverse().find(m => m.role === "assistant"); return m ? m.text : ""; }

// ---------------- events
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  on("#takeBtn", "click", () => pick("cam", "identify"));
  on("#libBtn", "click", () => pick("lib", "identify"));
  ["#homeBtn", "#homeBtn2", "#homeBtn3"].forEach(id => on(id, "click", goHome));
  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openSession(b.dataset.open)));
  document.querySelectorAll("[data-action]").forEach(b => b.addEventListener("click", () => startTask(b.dataset.action)));
  document.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => stepOp(b.dataset.op)));
  on("#verifyBtn", "click", () => pick("cam", "verify"));
  on("#editBtn", "click", () => { st.editing = true; render(); setTimeout(() => { const el = $("#edName"); if (el) { el.focus(); el.select(); } }, 30); });
  on("#edCancel", "click", () => { st.editing = false; render(); });
  on("#edSave", "click", saveCorrection);
  ["#edName", "#edBrand", "#edModel"].forEach(id => on(id, "keydown", e => { if (e.key === "Enter") saveCorrection(); if (e.key === "Escape") { st.editing = false; render(); } }));
  on("#failBtn", "click", () => failed());
  on("#customBtn", "click", () => { const v = $("#customIn").value.trim(); if (v) startTask("custom", v); });
  on("#customIn", "keydown", e => { if (e.key === "Enter") $("#customBtn").click(); });
  on("#detailBtn", "click", () => { const v = $("#detailIn").value.trim(); if (v) startTask(st.s.task.action || "troubleshoot", v); });
  on("#detailIn", "keydown", e => { if (e.key === "Enter") $("#detailBtn").click(); });
}

let pickPurpose = "identify";
function pick(kind, purpose) { pickPurpose = purpose; unlockAudio(); (kind === "cam" ? $("#fileCam") : $("#fileLib")).click(); }
["#fileCam", "#fileLib"].forEach(id => $(id).addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (pickPurpose === "identify") identify(f);
  else if (pickPurpose === "verify") verifyPhoto(f);
  else sendChat("Here's a new photo.", f);
}));

async function run(text, fn) {
  if (st.busy) return; st.busy = true;
  const prevView = st.view;
  if (st.view !== "session") { st.view = "loading"; st.loadingText = text; render(); cycleLoading(); }
  else toast(text, 0);
  try { await fn(); }
  catch (e) { if (e.message !== "code") { toast(e.message); if (prevView === "home") { st.view = "home"; } } }
  finally { st.busy = false; hideToastIfSticky(); render(); speakNew(); }
}
let loadTimer = null;
function cycleLoading() {
  const lines = ["Looking closely…", "Reading labels and model numbers…", "Figuring out what it is…"];
  let i = 0; clearInterval(loadTimer);
  loadTimer = setInterval(() => { const el = $("#loadText"); if (!el || st.view !== "loading") return clearInterval(loadTimer); el.textContent = lines[++i % lines.length]; }, 1800);
}

function identify(file) {
  const note = ($("#noteIn") && $("#noteIn").value.trim()) || "";
  return run("Looking closely…", async () => {
    st.s = await api("/api/identify", {method:"POST", form: fd({photo: file, note})});
    st.lastVerdict = null; st.view = "session";
  });
}
function startTask(action, detail="") {
  return run("Finding the official instructions…", async () => {
    st.s = await api("/api/task", {method:"POST", form: fd({session_id: st.s.id, action, detail})});
    st.lastVerdict = null;
  });
}
async function stepOp(op) {
  unlockAudio();
  try { st.s = await api("/api/step", {method:"POST", form: fd({session_id: st.s.id, op})}); st.lastVerdict = null; render(); speakNew(); }
  catch (e) { if (e.message !== "code") toast(e.message); }
}
function verifyPhoto(file) {
  return run("Checking your work…", async () => {
    const r = await api("/api/verify", {method:"POST", form: fd({session_id: st.s.id, photo: file})});
    st.lastVerdict = r.verdict.verdict === "done" ? null : r.verdict; st.s = r;
    toast(r.verdict.verdict === "done" ? "Looks good ✓" : (r.verdict.verdict === "not_yet" ? "Not quite yet" : "Couldn't tell from that photo"));
  });
}
function saveCorrection() {
  const name = ($("#edName").value || "").trim();
  if (!name) { toast("Type what it is first."); return $("#edName").focus(); }
  const brand = $("#edBrand").value.trim(), model = $("#edModel").value.trim();
  return run("Updating with your correction…", async () => {
    st.s = await api("/api/correct", {method:"POST", form: fd({session_id: st.s.id, name, brand, model})});
    st.editing = false; st.lastVerdict = null;
    toast("Updated. Pick what you want to do.");
  });
}
function failed() {
  const x = st.s.steps[st.s.current];
  sendChat(`That step didn't work${x ? ` (step ${st.s.current + 1}: ${x.title})` : ""}.`);
}
function sendChat(message, photo) {
  return run("Thinking…", async () => {
    st.s = await api("/api/chat", {method:"POST", form: fd({session_id: st.s.id, message, photo})});
  });
}
async function openSession(id) {
  try { st.s = await api("/api/session/" + id); st.editing = false; st.view = "session"; st.lastVerdict = null; st.spokenN[id] = st.spokenN[id] ?? (st.s.messages.at(-1)?.n || 0); render(); window.scrollTo(0,0); }
  catch (e) { if (e.message !== "code") toast(e.message); }
}
async function goHome() { st.editing = false; st.view = "home"; st.s = null; stopListening(); await loadRecent(); render(); window.scrollTo(0,0); }
async function loadRecent() { try { st.recent = await api("/api/recent"); } catch { st.recent = []; } }

$("#sendBtn").addEventListener("click", () => { const v = $("#ask").value.trim(); if (!v || !st.s) return; $("#ask").value = ""; handleUtterance(v, true); });
$("#ask").addEventListener("keydown", e => { if (e.key === "Enter") $("#sendBtn").click(); });
$("#camBtn").addEventListener("click", () => pick("cam", st.s && st.s.stage === "coaching" ? "verify" : "chat"));

// ---------------- toast
let toastTimer = null, toastSticky = false;
function toast(text, ms = 2600, actionLabel, action) {
  const t = $("#toast");
  t.innerHTML = esc(text) + (actionLabel ? ` <button>${esc(actionLabel)}</button>` : "");
  if (action) t.querySelector("button").onclick = () => { t.classList.remove("show"); action(); };
  t.classList.add("show"); clearTimeout(toastTimer); toastSticky = ms === 0;
  if (ms) toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}
function hideToastIfSticky(){ if (toastSticky) { $("#toast").classList.remove("show"); toastSticky = false; } }

// ---------------- live inbox (photos and replies from the glasses via WhatsApp)
async function poll() {
  try {
    const r = await api("/api/inbox?after=" + st.latestSeq);
    st.latestSeq = r.latest;
    for (const e of r.events) {
      if (st.s && e.session_id === st.s.id && !st.busy) {
        const fresh = await api("/api/session/" + e.session_id);
        if (fresh.version !== st.s.version && !st.editing) { st.s = fresh; render(); speakNew(); }
      } else if (e.kind === "new_photo" && e.channel === "whatsapp") {
        if (st.view === "home") { await openSession(e.session_id); toast("📸 New photo from your glasses"); }
        else toast("📸 New photo from your glasses", 6000, "Open", () => openSession(e.session_id));
      }
    }
  } catch {}
  setTimeout(poll, 2500);
}

// ---------------- hands-free voice (audio plays through the glasses when they're paired over Bluetooth)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let audioUnlocked = false, rec = null, listening = false, speaking = false;
function unlockAudio() {
  if (audioUnlocked || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); audioUnlocked = true;
}
function speakText(text) {
  return new Promise(res => {
    if (!("speechSynthesis" in window) || !text) return res();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 1.03; u.pitch = 1;
    const v = speechSynthesis.getVoices().find(v => /en-US/.test(v.lang) && /(Samantha|Ava|Allison|Google US)/.test(v.name));
    if (v) u.voice = v;
    speaking = true; u.onend = u.onerror = () => { speaking = false; res(); };
    speechSynthesis.speak(u);
  });
}
async function speakNew() {
  if (!st.hf || !st.s) return;
  const s = st.s, seen = st.spokenN[s.id] || 0;
  const fresh = s.messages.filter(m => m.role === "assistant" && m.n > seen);
  if (!fresh.length) return listenSoon();
  st.spokenN[s.id] = Math.max(...fresh.map(m => m.n));
  const say = fresh.map(m => m.spoken || m.text);
  if (s.stage === "menu" && s.actions.length && fresh.some(m => m.kind === "identify"))
    say.push("Say " + s.actions.map(a => a.label).join(", or ") + ".");
  stopListening();
  for (const line of say) await speakText(line);
  listenSoon();
}
function listenSoon() { if (st.hf && SR && st.view === "session" && !st.busy && st.s.stage !== "stopped") setTimeout(listen, 350); }
function chime(f = 880) {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(); const o = c.createOscillator(), g = c.createGain();
    o.frequency.value = f; g.gain.setValueAtTime(.06, c.currentTime); g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + .18);
    o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + .2); } catch {}
}
function listen(manual = false) {
  if (!SR || speaking || listening || st.busy) return;
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 1;
  listening = true; $("#micBtn").classList.add("rec"); chime();
  let got = false;
  rec.onresult = e => { got = true; const t = e.results[0][0].transcript; handleUtterance(t, manual); };
  rec.onerror = () => {};
  rec.onend = () => { listening = false; $("#micBtn").classList.remove("rec"); if (!got && st.hf && !manual) setTimeout(() => { if (st.hf && !st.busy && !speaking) listen(); }, 1200); };
  try { rec.start(); } catch { listening = false; $("#micBtn").classList.remove("rec"); }
}
function stopListening() { if (rec && listening) { try { rec.abort(); } catch {} } listening = false; $("#micBtn").classList.remove("rec"); }

function norm(t){ return t.toLowerCase().replace(/[^\w\s']/g," ").replace(/\b(uh+|um+|hey|okay|ok|so|please|just|i think|alright)\b/g," ").replace(/\s+/g," ").trim(); }
function handleUtterance(text, typed=false) {
  const s = st.s; if (!s) return;
  const t = norm(text);
  if (s.stage === "coaching") {
    if (/^(done|did it|finished|next|got it|that worked|it worked|ready|yes|yep|yeah|complete)\b/.test(t)) return stepOp("next");
    if (/^(repeat|again|say (that|it) again|what was that|come again)\b/.test(t)) { st.spokenN[s.id] = 0; return stepOp("repeat"); }
    if (/^(back|go back|previous)\b/.test(t)) return stepOp("back");
    if (/^skip\b/.test(t)) return stepOp("skip");
    if (/(check (this|it|my work)|take a look|look at (this|it)|photo)/.test(t)) { speakText("Hold up your phone and tap the camera."); return pick("cam", "verify"); }
    if (/(didn'?t work|not working|doesn'?t work|still (broken|not|the same)|nope|no luck)/.test(t)) return sendChat(`That step didn't work: ${text}`);
  }
  if (s.stage === "menu" || s.stage === "finished") {
    const nums = {one:0,"1":0,first:0,two:1,"2":1,second:1,three:2,"3":2,third:2,four:3,"4":3};
    const first = t.split(" ")[0];
    if (first in nums && s.actions[nums[first]]) return startTask(s.actions[nums[first]].id);
    const hit = s.actions.find(a => t.includes(norm(a.label)) || t.includes(a.id) ||
      (a.id === "setup" && /set (it |this )?up|setup|install|assemble/.test(t)) || (a.id === "troubleshoot" && /fix|problem|broken|wrong|error/.test(t)) ||
      (a.id === "learn" && /learn|how (do i|to) use|controls|teach/.test(t)));
    if (hit) return startTask(hit.id);
    if (typed || t.split(" ").length > 2) return startTask("custom", text);
  }
  if (s.stage === "need_info") return startTask(s.task.action || "troubleshoot", text);
  if (t.length < 2) return listenSoon();
  sendChat(text);
}

$("#micBtn").addEventListener("click", () => { unlockAudio(); if (!SR) return toast("Voice input isn't supported in this browser."); listening ? stopListening() : listen(true); });
$("#hfBtn").addEventListener("click", async () => {
  unlockAudio(); st.hf = !st.hf; localStorage.setItem("pa_hf", st.hf ? "1" : "0");
  if (st.hf && "wakeLock" in navigator) { try { await navigator.wakeLock.request("screen"); } catch {} }
  render();
  if (st.hf) { toast(SR ? "Hands-free on. I'll talk you through it." : "Hands-free on. I'll read every step aloud."); if (st.s) { st.spokenN[st.s.id] = (st.s.messages.filter(m=>m.role==="assistant").at(-2)?.n) || 0; speakNew(); } }
  else { speechSynthesis && speechSynthesis.cancel(); stopListening(); }
});

// ---------------- access gate + boot
function showGate(){ $("#gate").classList.remove("hidden"); setTimeout(() => $("#code").focus(), 50); }
$("#codeBtn").addEventListener("click", async () => {
  const code = $("#code").value.trim(); $("#codeErr").textContent = "";
  const r = await fetch("/access", {method:"POST", body: fd({code})});
  if (r.ok) { st.code = code; sessionStorage.setItem("pa_code", code); $("#gate").classList.add("hidden"); boot(); }
  else { let d = {}; try { d = await r.json(); } catch {} $("#codeErr").textContent = d.detail || "That code didn't work."; }
});
$("#code").addEventListener("keydown", e => { if (e.key === "Enter") $("#codeBtn").click(); });

let booted = false;
async function boot() {
  try { st.status = await (await fetch("/api/status")).json(); } catch {}
  if (st.status.access_code_required && !st.code) { render(); return showGate(); }
  try { const r = await api("/api/inbox?after=999999999"); st.latestSeq = r.latest; } catch (e) { if (e.message === "code") return; }
  await loadRecent(); render();
  if (!booted) { booted = true; poll(); }
}
render(); boot();
</script>
</body>
</html>
