<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point and Ask</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5f6b7a; --accent: #1e407c; --warn-bg: #fff4e5; --warn: #8a4b00; --ok-bg: #eaf3ff; --border: #d8dde3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --card: #1d2228; --text: #e8ebef; --muted: #9aa5b1; --accent: #8fb4ff; --warn-bg: #3a2a12; --warn: #ffc77a; --ok-bg: #1b2a40; --border: #333b44; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  form, .result { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  label:first-child { margin-top: 0; }
  select, textarea, input[type=file] { width: 100%; font: inherit; color: inherit; }
  select, textarea { padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); }
  textarea { min-height: 70px; resize: vertical; }
  #preview { display: none; max-width: 100%; max-height: 260px; margin-top: 10px; border-radius: 8px; }
  button { margin-top: 16px; padding: 10px 18px; font: inherit; font-weight: 600; border: 0; border-radius: 8px; background: var(--accent); color: var(--card); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .result { display: none; margin-top: 16px; }
  .result.answered { background: var(--ok-bg); }
  .result.escalate { background: var(--warn-bg); }
  .result.escalate .tag { color: var(--warn); }
  .tag { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #answer { margin: 6px 0; font-size: 1.1rem; }
  #source { color: var(--muted); font-size: .9rem; }
  .speak { margin-top: 8px; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 6px 12px; }
</style>
</head>
<body>
<main>
  <h1>Point and Ask</h1>
  <p class="sub">Upload a photo, ask a question, get an answer from our own guides.</p>

  <form id="form">
    <label for="pack">Knowledge pack</label>
    <select id="pack" name="pack"></select>

    <label for="photo">Photo</label>
    <input id="photo" name="photo" type="file" accept="image/*,.heic,.heif">
    <img id="preview" alt="Photo preview">

    <label for="question">Question</label>
    <textarea id="question" name="question" required placeholder="What do I do at this station?"></textarea>

    <button id="submit" type="submit">Ask</button>
  </form>

  <section id="result" class="result" aria-live="polite">
    <div class="tag" id="tag"></div>
    <p id="answer"></p>
    <div id="source"></div>
    <button class="speak" id="speak" type="button">Read aloud</button>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

fetch("/packs").then(r => r.json()).then(packs => {
  for (const p of packs) {
    const opt = new Option(p.name, p.id);
    opt.title = p.description;
    $("pack").add(opt);
  }
});

$("photo").addEventListener("change", () => {
  const file = $("photo").files[0];
  const img = $("preview");
  if (!file) { img.style.display = "none"; return; }
  img.src = URL.createObjectURL(file);
  img.onload = () => { img.style.display = "block"; };
  img.onerror = () => { img.style.display = "none"; }; // e.g. HEIC in browsers that can't show it
});

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("submit").disabled = true;
  $("submit").textContent = "Thinking…";
  try {
    const res = await fetch("/ask", { method: "POST", body: new FormData($("form")) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    show(data);
  } catch (err) {
    show({ status: "escalate", answer: err.message, source_doc: null });
  } finally {
    $("submit").disabled = false;
    $("submit").textContent = "Ask";
  }
});

function show(data) {
  const box = $("result");
  box.className = "result " + data.status;
  box.style.display = "block";
  $("tag").textContent = data.status === "answered" ? "Answer" : "Ask a person";
  $("answer").textContent = data.answer;
  $("source").textContent = data.source_doc ? "Source: " + data.source_doc : "";
}

$("speak").addEventListener("click", () => {
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance($("answer").textContent));
});
</script>
</body>
</html>
